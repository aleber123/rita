<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Vibrant magenta-to-violet radial gradient: distinctive in time-tracking category -->
    <radialGradient id="bg" cx="30%" cy="20%" r="110%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </radialGradient>

    <!-- Soft top highlight for "premium/glossy" feel -->
    <radialGradient id="highlight" cx="50%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Clock face subtle depth -->
    <radialGradient id="face" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>

    <!-- Inner ring gradient hints progress/motion -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="clockShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dx="0" dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle with gradient + top gloss -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#highlight)"/>

  <!-- Clock: dominant, centered. One focal point → reads at 60px -->
  <g transform="translate(512 528)" filter="url(#clockShadow)">
    <!-- White body -->
    <circle r="340" fill="url(#face)"/>

    <!-- Outer bold dark ring (strong silhouette at small sizes) -->
    <circle r="340" fill="none" stroke="#3B0764" stroke-width="36"/>

    <!-- Inner accent arc: golden 270° sweep → "time = money" + hints progress -->
    <circle r="290" fill="none" stroke="url(#accent)" stroke-width="20"
            stroke-linecap="round"
            stroke-dasharray="1365 1824"
            transform="rotate(-90)"/>

    <!-- Minimal hour marks at 12, 3, 6, 9 -->
    <rect x="-14" y="-260" width="28" height="48" rx="6" fill="#3B0764"/>
    <rect x="212" y="-14" width="48" height="28" rx="6" fill="#3B0764"/>
    <rect x="-14" y="212" width="28" height="48" rx="6" fill="#3B0764"/>
    <rect x="-260" y="-14" width="48" height="28" rx="6" fill="#3B0764"/>

    <!-- Hands at 10:10 (smile-pattern, highest-CVR watch pose) -->
    <!-- Minute hand: longer, to "2" position -->
    <rect x="-11" y="-210" width="22" height="220" rx="6" fill="#3B0764" transform="rotate(60)"/>
    <!-- Hour hand: shorter, thicker, to "10" position -->
    <rect x="-14" y="-140" width="28" height="150" rx="6" fill="#3B0764" transform="rotate(-60)"/>

    <!-- Center cap -->
    <circle r="22" fill="#3B0764"/>
    <circle r="8" fill="#FDE047"/>
  </g>
</svg>
