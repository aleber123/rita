<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Mesh-style gradient: layered radial gradients for organic depth -->
    <radialGradient id="baseGradient" cx="70%" cy="85%" r="90%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#2E0A5F"/>
      <stop offset="100%" stop-color="#170533"/>
    </radialGradient>

    <radialGradient id="meshBlob1" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshBlob2" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshBlob3" cx="50%" cy="110%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle top-left specular highlight (glass/premium feel) -->
    <radialGradient id="specular" cx="25%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Arc gradient: white-to-pink for subtle shimmer -->
    <linearGradient id="arcGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF2F8"/>
    </linearGradient>

    <!-- Glow filter for the arc -->
    <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Softer glow behind the dot -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot itself: gold gradient for premium feel -->
    <radialGradient id="dotFill" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>

  <!-- Background: layered mesh gradient -->
  <rect width="1024" height="1024" rx="228" fill="url(#baseGradient)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#meshBlob3)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#meshBlob2)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#meshBlob1)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#specular)"/>

  <!-- Main element: 3/4 arc (270°), centered. Modern timer metaphor -->
  <g transform="translate(512 512)" filter="url(#arcGlow)">
    <!-- Arc: stroke a full circle, use dasharray to show only 270°.
         Circumference = 2 * PI * r = 2 * PI * 290 ≈ 1822.
         270° = 3/4 of 1822 ≈ 1366. -->
    <circle r="290" fill="none"
            stroke="url(#arcGradient)"
            stroke-width="86"
            stroke-linecap="round"
            stroke-dasharray="1366 1823"
            transform="rotate(-90)"/>
  </g>

  <!-- Glow behind the end-dot (at 9 o'clock / 270° position from 12) -->
  <!-- End position: after 270° sweep starting at top, we end at 9 o'clock = (-290, 0) from center -->
  <circle cx="222" cy="512" r="90" fill="url(#dotGlow)"/>

  <!-- End-dot itself -->
  <circle cx="222" cy="512" r="44" fill="url(#dotFill)"/>
  <!-- Small white highlight on the dot -->
  <circle cx="214" cy="502" r="10" fill="#FFFFFF" opacity="0.6"/>

  <!-- Clock hands: thin, minimal, modern. 10:10 smile pose.
       White with matching arc gradient, rounded caps. Same glow filter. -->
  <g transform="translate(512 512)" filter="url(#arcGlow)">
    <!-- Minute hand: longer, slightly thinner, pointing to "2" (60° clockwise from 12) -->
    <rect x="-9" y="-210" width="18" height="220" rx="9"
          fill="url(#arcGradient)"
          transform="rotate(60)"/>
    <!-- Hour hand: shorter, slightly thicker, pointing to "10" (-60° from 12) -->
    <rect x="-11" y="-150" width="22" height="160" rx="11"
          fill="url(#arcGradient)"
          transform="rotate(-60)"/>
    <!-- Center pivot: small white disc with tiny gold core (echoes end-dot) -->
    <circle r="20" fill="#FFFFFF"/>
    <circle r="8" fill="url(#dotFill)"/>
  </g>
</svg>
