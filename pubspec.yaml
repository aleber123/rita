name: rita
description: "Rita – färglägg roliga teckningar för barn 3–8 år."
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database (saved drawings, unlocked modules)
  sqflite: ^2.4.2
  path: ^1.9.1

  # Shared preferences (settings, parental gate state)
  shared_preferences: ^2.3.4

  # UUID generation
  uuid: ^4.5.1

  # Path provider (saved drawings)
  path_provider: ^2.1.5

  # In-App Purchases (module unlock)
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.3.0

  # Facebook App Events / Conversions API (paid acquisition attribution)
  facebook_app_events: ^0.27.0

  # iOS App Tracking Transparency (ATT) — required for Meta attribution
  app_tracking_transparency: ^2.0.6

  # Save & share finished drawings
  share_plus: ^10.1.2

  # Camera-to-coloring (kid takes a photo, edges become a coloring page).
  # Pure on-device pixel processing — no AI/ML, no network.
  image_picker: ^1.1.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFE4B5"
  adaptive_icon_foreground: "assets/app_icon/app_icon_1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/drawings/free/
    - assets/drawings/unicorns/
    - assets/drawings/superheroes/
    - assets/drawings/animals/
    - assets/drawings/vehicles/
    - assets/drawings/dinosaurs/
    - assets/app_icon/
